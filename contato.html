<main class="main-content">
  <header class="top-header">
    <h1>Gestão de Distribuição Alimentícia</h1>
  </header>

  <section id="contato" class="section-card">
            <h2 class="section-title">Fale Conosco</h2>
            <form action="#" method="get" onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso!');">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" class="form-control" placeholder="Seu nome" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="assunto">Assunto</label>
                        <input type="text" id="assunto" name="assunto" class="form-control" placeholder="Motivo do contato" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" class="form-control" placeholder="Escreva sua mensagem aqui..." required></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Enviar Mensagem</button>
            </form>
        </section>

  <a href="index.html">Voltar</a>

  <!-- Footer -->
        <footer class="page-footer">
            <p>&copy; 2026 Sabor & Vida Distribuidora de Alimentos. Todos os direitos reservados.</p>
        </footer>
</main>
